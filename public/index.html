<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Pro</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: #fff; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #111827; border-bottom: 1px solid #1f2937; }
        .logo { font-size: 24px; font-weight: bold; color: #f43f5e; cursor: pointer; }
        .city-btn { background: #1f2937; border: 1px solid #374151; padding: 8px 16px; border-radius: 20px; color: #fff; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .city-btn:hover { border-color: #f43f5e; color: #f43f5e; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #111827; padding: 30px; border-radius: 16px; max-width: 550px; width: 90%; text-align: center; border: 1px solid #374151; }
        .grid-cities { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 20px; }
        .city-card { background: #1f2937; padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; font-weight: 500; transition: 0.2s; }
        .city-card:hover { border-color: #f43f5e; background: #2d3748; }

        .container { padding: 40px; max-width: 1200px; margin: 0 auto; }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; margin-top: 20px; }
        .movie-card { background: #111827; border-radius: 12px; overflow: hidden; border: 1px solid #1f2937; cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: translateY(-5px); border-color: #374151; }
        .movie-card img { width: 100%; height: 340px; object-fit: cover; }
        .movie-info { padding: 15px; }
        .movie-title { margin: 0 0 8px 0; font-size: 18px; }
        .movie-meta { font-size: 14px; color: #9ca3af; display: flex; justify-content: space-between; }

        .view-section { display: none; }
        .active-section { display: block; }

        .details-layout { display: flex; gap: 40px; background: #111827; padding: 30px; border-radius: 16px; border: 1px solid #1f2937; }
        .details-img { width: 300px; height: 450px; object-fit: cover; border-radius: 8px; }
        
        .date-container { display: flex; gap: 12px; margin: 20px 0; overflow-x: auto; padding-bottom: 5px; }
        .date-pill { background: #1f2937; border: 1px solid #374151; color: white; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .date-pill.selected { background: #f43f5e; border-color: #f43f5e; }
        
        .theatre-row { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .time-btn { background: #1f2937; border: 1px solid #374151; color: #10b981; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 10px; font-weight: 600; }
        .time-btn:hover { background: #10b981; color: white; }

        .seat-grid { display: grid; grid-template-columns: repeat(10, 35px); gap: 8px; justify-content: center; margin: 30px 0; }
        .seat { width: 35px; height: 35px; background: #374151; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; user-select: none; }
        .seat.selected { background: #f43f5e !important; color: white; }
        .seat.occupied { background: #1f2937 !important; color: #4b5563; cursor: not-allowed; }
        .vip-seat { background: #b45309; }

        .btn-prime { background: #f43f5e; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; display: block; margin: 20px auto 0 auto; text-align: center; }
        .receipt { background: #111827; border: 2px dashed #374151; padding: 30px; border-radius: 12px; max-width: 500px; margin: 0 auto; text-align: center; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showDashboard()">BookMyShow Pro</div>
        <button class="city-btn" id="nav-city-btn">📍 Select City</button>
    </nav>

    <!-- City Selection Modal -->
    <div class="modal" id="city-modal">
        <div class="modal-content">
            <h2 style="margin-top:0;">Select Your City</h2>
            <div class="grid-cities" id="modal-city-grid"></div>
        </div>
    </div>

    <div class="container">
        <!-- Dashboard Section -->
        <div id="section-dashboard" class="view-section active-section">
            <h2 id="dashboard-heading">Recommended Movies</h2>
            <div class="movies-grid" id="movies-container"></div>
        </div>

        <!-- Movie Details & Timing Section -->
        <div id="section-details" class="view-section">
            <button class="city-btn" onclick="showDashboard()" style="margin-bottom:20px;">← Back to Movies</button>
            <div class="details-layout" id="details-root"></div>
            
            <h3 style="margin-top:40px;">1. Select Date</h3>
            <div class="date-container" id="dates-root"></div>

            <h3 style="margin-top:20px;">2. Select Theatre & Show Time</h3>
            <div id="theatres-root"></div>
        </div>

        <!-- Seat Selection Section -->
        <div id="section-seats" class="view-section">
            <button class="city-btn" onclick="showDetails(currentMovie.id)" style="margin-bottom:20px;">← Back to Times</button>
            <h2 style="text-align:center; margin-bottom:5px;" id="seat-movie-title">Select Seats</h2>
            <p style="text-align:center; color:#9ca3af; margin:0;" id="seat-show-details"></p>
            
            <div style="background:#fff; height:4px; width:300px; margin:30px auto; border-radius:2px; box-shadow: 0 4px 20px rgba(255,255,255,0.5);"></div>
            <p style="text-align:center; font-size:12px; color:#9ca3af; margin-top:-20px; margin-bottom:30px;">All eyes this way please!</p>

            <div class="seat-grid" id="seats-container"></div>
            
            <div style="text-align:center; margin-top:20px;">
                <span style="display:inline-block; margin-right:15px;"><span style="display:inline-block; width:15px; height:15px; background:#374151; border-radius:3px; vertical-align:middle;"></span> Normal (₹150)</span>
                <span style="display:inline-block; margin-right:15px;"><span style="display:inline-block; width:15px; height:15px; background:#b45309; border-radius:3px; vertical-align:middle;"></span> VIP (₹300)</span>
                <span style="display:inline-block;"><span style="display:inline-block; width:15px; height:15px; background:#f43f5e; border-radius:3px; vertical-align:middle;"></span> Selected</span>
            </div>

            <button class="btn-prime" onclick="processBooking()">Book Tickets (<span id="total-price-display">₹0</span>)</button>
        </div>

        <!-- Ticket Receipt Section -->
        <div id="section-receipt" class="view-section">
            <div class="receipt" id="receipt-root"></div>
            <button class="btn-prime" onclick="showDashboard()">Book More Movies</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
